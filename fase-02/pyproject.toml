[project]
name = "tc-fase2-genetic-llm"
version = "0.1.0"
description = "Tech Challenge Fase 2: Algoritmos Genéticos e LLM para diagnóstico médico"
authors = [
    {name = "Fernando Marques do Vale"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas (>=2.2.0,<3.0.0)",
    "numpy (>=2.2.0,<3.0.0)",
    "scikit-learn (>=1.6.0,<2.0.0)",
    "matplotlib (>=3.9.0,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "jupyter (>=1.1.1,<2.0.0)",
    "notebook (>=7.6.2,<8.0.0)",
    "ipykernel (>=7.3.0,<8.0.0)",
    "joblib (>=1.5.3,<2.0.0)",
    "tqdm (>=4.70.0,<5.0.0)",
    "ollama (>=0.6.2,<0.7.0)",
    "shap (>=0.44.0,<0.52.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false